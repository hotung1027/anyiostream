[project]
name = "anyiostream"
version = "0.0.1-alpha"
authors = [
    { name = "randy", email = "hotung1027@gmail.com" },
]
description = "Composable async pipelines with structured concurrency — built on anyio, inspired by aiostream and Rust's Result type."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = [
    "async",
    "pipeline",
    "stream",
    "anyio",
    "concurrency",
    "structured-concurrency",
    "result",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "anyio>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "anyio[trio]",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.14.0",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinx-autodoc2>=0.5",
]

[project.urls]
Homepage = "https://github.com/hotung1027/anyiostream"
Repository = "https://github.com/hotung1027/anyiostream"
Issues = "https://github.com/hotung1027/anyiostream/issues"

[build-system]
requires = ["uv_build >= 0.10.0, <0.11.0"]
build-backend = "uv_build"

[tool.uv_build]
packages = ["src/anyiostream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Async support — run on both asyncio and trio backends
asyncio_default_fixture_loop_scope = "function"
trio_mode = "true"
anyio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "-v",
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "ARG"]
