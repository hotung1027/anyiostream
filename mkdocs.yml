site_name: anyiostream
site_url: https://hotung1027.github.io/anyiostream
site_description: Composable async pipelines with structured concurrency
site_author: randyt
repo_name: hotung1027/anyiostream
repo_url: https://github.com/hotung1027/anyiostream

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Pipeline Basics: guide/pipeline-basics.md
      - Concurrency & Workers: guide/concurrency.md
      - Error Handling: guide/error-handling.md
  - API Reference:
      - Stream: api/stream.md
      - Pipe Operators: api/pipe.md
      - Result Types: api/result.md
      - Process: api/process.md
  - Comparison: comparison.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hotung1027/anyiostream
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/anyiostream/
